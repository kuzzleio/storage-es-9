name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit + conformance (Elasticsearch ${{ matrix.elasticsearch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        elasticsearch: ["9.0.8", "9.5.5"]
    services:
      elasticsearch:
        image: docker.io/library/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          ELASTICSEARCH_NODE: http://localhost:9200
