name: Release

on:
  push:
    branches:
      - master
      - beta

jobs:
  # The CI workflow, unit and conformance suites included: nothing is published
  # unless it passes on the commit being released.
  test:
    name: Test
    uses: ./.github/workflows/ci.yaml

  npm-deploy:
    name: Build and deploy release on NPM.js
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Node version 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SEMANTIC_RELEASE_NPM_PUBLISH: "true"
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release

  documentation-deploy:
    name: Deploy the documentation
    needs: [npm-deploy]
    runs-on: ubuntu-24.04
    steps:
      # A kuzzlebot installation token instead of the ACCESS_TOKEN_CI personal
      # token: it expires within the hour, is scoped to kuzzleio/documentation
      # and to `actions: write` (dispatching a workflow and following its run),
      # and is tied to no one's account.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}
          owner: kuzzleio
          repositories: documentation
          permission-actions: write

      # master deploys to docs.kuzzle.io, beta to next-docs.kuzzle.io
      - uses: convictional/trigger-workflow-and-wait@v1.6.3
        with:
          owner: kuzzleio
          repo: documentation
          github_token: ${{ steps.app-token.outputs.token }}
          workflow_file_name: child_repo.workflow.yml
          ref: ${{ github.ref_name == 'master' && 'master' || 'develop' }}
          client_payload: '{"repo_name":"storage-es-9","branch":"${{ github.ref_name }}","version":"1"}'
